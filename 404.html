<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · SuperFinder</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/superfinder-site/favicon.png">
<link rel="stylesheet" href="/superfinder-site/assets/css/site.css">
<style>
  /* 零 flex 纯块流：margin auto 居中 + 显式横向 padding，杜绝任何舞台级偏移 */
  .nf-stage { min-height: 100vh; padding: 16vh 0 10vh; background: var(--field-2); color: var(--paper); }
  .nf-card { max-width: 30em; margin: 0 auto; padding: 0 24px; text-align: center; }
  .nf-code { font-family: var(--mono); font-size: clamp(64px, 12vw, 110px); letter-spacing: .04em; color: var(--paper-3); line-height: 1; }
  .nf-title { font-size: clamp(1.3rem, 2.6vw, 1.7rem); font-weight: 600; margin: 18px 0 10px; }
  .nf-sub-en { color: var(--paper-3); font-size: .92rem; margin-top: 4px; overflow-wrap: break-word; }
  .nf-links { margin-top: 30px; display: inline-block; }
  .nf-links a { display: inline-block; padding: 10px 22px; border-radius: 999px; font-size: 14px; text-decoration: none; border: 1px solid var(--hair-d); color: var(--paper); transition: background .12s; margin: 0 6px 8px; }
  .nf-links a:hover { background: rgba(245, 244, 240, .06); }
  .nf-links a.primary { background: var(--paper); color: var(--ink); border-color: var(--paper); }
</style>
</head>
<body>
<main class="nf-stage">
  <div class="nf-card">
    <div class="nf-code">404</div>
    <p class="nf-title">这一页不在了，但现场还在。</p>
    <p class="nf-sub-en">This page has moved on — the workspace is still where you left it.</p>
    <div class="nf-links">
      <a class="primary" href="/superfinder-site/">中文首页</a><a href="/superfinder-site/en/">English home</a>
    </div>
  </div>
</main>
</body>
</html>
